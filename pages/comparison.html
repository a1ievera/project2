<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Blog | Comparison</title>
  <link rel="stylesheet" href="../css/shared.css">
  <link rel="stylesheet" href="../css/comparison.css">
</head>
<body class="inner-page">
  <header class="site-header">
    <nav aria-label="Main navigation">
      <a href="../index.html">THE<br>HOMEPAGE</a>
      <a class="active" aria-current="page" href="comparison.html">THE<br>COMPARISON</a>
      <a href="music.html">THE<br>PLAYLIST</a>
    </nav>
  </header>
  <main class="page-content">
    <p class="eyebrow">WHAT MUSIC APP SHOULD YOU USE?</p>
    <h1>THE COMPARISON</h1>
    <section class="comparison-list" aria-label="Music app reviews and stats">
      <article class="service-card service-card--spotify">
        <div class="service-art">
          <img src="../images/spotify-logo.png" alt="Spotify logo" loading="lazy">
        
          </div>
        </div>
      </article>
      <article class="service-card service-card--youtube">
        <div class="service-art">
          <img src="../images/youtube-logo.png" alt="YouTube Music logo" loading="lazy">
          </div>
        </div>
      </article>
      <article class="service-card service-card--apple">
        <div class="service-art">
          <img src="../images/apple-logo.png" alt="Apple Music logo" loading="lazy">
        </div>
        <div class="service-content">
          <div class="review-stat-layout">
            <section class="review-area" aria-label="Apple Music review">
        
            </section>
          </div>
        </div>
      </article>
    </section>
  </main>
</body>
</html>
